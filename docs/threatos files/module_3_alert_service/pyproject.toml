[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threatos"
version = "0.1.0"
description = "ThreatOS - MITRE ATT&CK-aware security operations platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.4",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "orjson>=3.10.3",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "pyyaml>=6.0.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "stix2>=3.0.1",
    "python-nmap>=0.7.1",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "fakeredis>=2.23.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["threatos/tests"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","W","F","I","B","UP"]
ignore = ["B008"]
